spring:
  application:
    name: flowpilot-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flowpilot:
  jwt:
    secret: ${FLOWPILOT_JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  password-reset:
    ttl-minutes: 30
  ai:
    # AI-assisted planning is opt-in and off by default. Empty Ollama defaults
    # mirror jwt.secret: when `enabled` is true, AiConfig fails context startup
    # unless both `ollama.base-url` and `ollama.model` are set (design D2). The
    # compose-layer ${VAR:?msg} guard lives in docker-compose.ai.yml only.
    enabled: ${FLOWPILOT_AI_ENABLED:false}
    ollama:
      base-url: ${FLOWPILOT_AI_OLLAMA_BASE_URL:}
      model: ${FLOWPILOT_AI_OLLAMA_MODEL:}
