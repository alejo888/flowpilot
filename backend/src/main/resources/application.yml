spring:
  application:
    name: flowpilot-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flowpilot:
  jwt:
    secret: ${FLOWPILOT_JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  password-reset:
    ttl-minutes: 30
