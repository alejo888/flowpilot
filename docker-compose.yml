services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FLOWPILOT_DB_NAME:?set FLOWPILOT_DB_NAME in your .env}
      POSTGRES_USER: ${FLOWPILOT_DB_USERNAME:?set FLOWPILOT_DB_USERNAME in your .env}
      POSTGRES_PASSWORD: ${FLOWPILOT_DB_PASSWORD:?set FLOWPILOT_DB_PASSWORD in your .env}
    volumes:
      - flowpilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLOWPILOT_DB_USERNAME:?set FLOWPILOT_DB_USERNAME in your .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${FLOWPILOT_DB_HOST_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${FLOWPILOT_DB_NAME:?set FLOWPILOT_DB_NAME in your .env}
      SPRING_DATASOURCE_USERNAME: ${FLOWPILOT_DB_USERNAME:?set FLOWPILOT_DB_USERNAME in your .env}
      SPRING_DATASOURCE_PASSWORD: ${FLOWPILOT_DB_PASSWORD:?set FLOWPILOT_DB_PASSWORD in your .env}
      FLOWPILOT_JWT_SECRET: ${FLOWPILOT_JWT_SECRET:?set FLOWPILOT_JWT_SECRET in your .env}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # https://localhost with a self-signed cert — used only by the WebKit
      # e2e projects, which need a `Secure` cookie over TLS (see frontend/nginx.conf).
      - "443:443"

volumes:
  flowpilot-db-data:
