name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test
      - name: Normalize known springdoc generation quirks before drift check
        # /api/auth/refresh's 403 (CSRF check failure) is raised by
        # CsrfProtectionFilter via response.sendError() at the servlet-filter
        # level, before the request ever reaches AuthController — springdoc
        # can't see that, so it reflects the method's own success return type
        # (AccessTokenResponse) onto the 403 response too. api/openapi.yaml
        # correctly documents this 403 as bodyless; strip springdoc's
        # incorrect inferred content here so the diff reflects real drift
        # only, not this known generation limitation.
        run: |
          jq 'del(.paths."/api/auth/refresh".post.responses."403".content)' \
            target/openapi-generated.json > target/openapi-generated.normalized.json
          mv target/openapi-generated.normalized.json target/openapi-generated.json
      - name: Check api/openapi.yaml matches the live-generated spec
        uses: oasdiff/oasdiff-action/diff@v0
        with:
          base: api/openapi.yaml
          revision: backend/target/openapi-generated.json
          fail-on-diff: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build
