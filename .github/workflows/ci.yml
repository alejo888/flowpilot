name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test
      - name: Report breaking changes between api/openapi.yaml and the live-generated spec
        # Non-blocking for now (no fail-on): a full run already surfaced 23
        # real errors + 6 warnings — legitimate contract gaps (e.g. request
        # fields the hand-authored spec allows blank but @NotBlank actually
        # rejects, response fields marked required that the DTO doesn't
        # guarantee, missing email format) that need dedicated DTO-level
        # annotation work and hand-authored spec corrections, tracked as a
        # follow-up rather than fixed blind here. Once that backlog is
        # cleared, add `fail-on: ERR` to make this gate the build.
        #
        # Uses oasdiff's `breaking` mode rather than `diff`: plain `diff`
        # compares everything byte-for-byte (descriptions, operationIds,
        # tags, schema `format` metadata), which is far too strict for two
        # independently-authored documents and was almost entirely cosmetic
        # noise, not real drift, when tried here.
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: api/openapi.yaml
          revision: backend/target/openapi-generated.json
          # Default is true: uploads the comparison to oasdiff.com and posts
          # a review link as a PR comment. Opt out — no third-party upload of
          # the API spec without explicit sign-off.
          review: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  e2e:
    runs-on: ubuntu-latest
    env:
      # CI-only ephemeral secret for a stack that's destroyed at the end of
      # the job — not a real credential, no rotation/secrecy requirement.
      FLOWPILOT_JWT_SECRET: ci-ephemeral-jwt-secret-flowpilot-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Wait for the backend to accept requests
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
              -H "Content-Type: application/json" -d '{"email":"x","password":"x"}' || true)
            if [ "$code" = "400" ] || [ "$code" = "401" ]; then
              echo "backend is up (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "backend never became ready" >&2
          docker compose logs backend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run responsive e2e suite
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
