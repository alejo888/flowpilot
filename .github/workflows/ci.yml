name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify Java runtime
        run: java -version 2>&1 | grep -q 'version "25'
      - name: Run backend tests
        run: ./mvnw -B test
      - name: Report breaking changes between api/openapi.yaml and the live-generated spec
        # The hand-authored contract is checked against the live-generated spec.
        # Uses oasdiff's `breaking` mode rather than `diff`: plain `diff`
        # compares everything byte-for-byte (descriptions, operationIds,
        # tags, schema `format` metadata), which is far too strict for two
        # independently-authored documents and creates cosmetic noise.
        #
        # Pinned to an exact SHA (not the floating `@v0` tag) so a bundled
        # `tufin/oasdiff` bump can never silently change the gate's severity
        # rules again. v0.1.14 ships oasdiff v1.30.0, which promoted
        # `request-property-max-length-set` to ERROR and added
        # `api-security-removed`; both are now satisfied by the live spec:
        # `config/OpenApiConfig` renders `components.securitySchemes.bearerAuth`
        # + per-operation `security` matching the contract, and
        # `RegisterRequest.password` carries an explicit `@Size(max = 72)` so
        # springdoc stops emitting `maxLength: 2147483647`. Re-check the
        # `tufin/oasdiff` changelog before the next bump.
        uses: oasdiff/oasdiff-action/breaking@54d7a752569cb30b644b7f27a362c1077973d1c0 # v0.1.14 (oasdiff v1.30.0)
        with:
          base: api/openapi.yaml
          revision: backend/target/openapi-generated.json
          fail-on: ERR
          # Default is true: uploads the comparison to oasdiff.com and posts
          # a review link as a PR comment. Opt out — no third-party upload of
          # the API spec without explicit sign-off.
          review: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node runtime
        run: node --version | grep -q '^v24\.'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  e2e:
    runs-on: ubuntu-latest
    env:
      # CI-only ephemeral values for a stack that's destroyed at the end of
      # the job — not real credentials, no rotation/secrecy requirement.
      FLOWPILOT_DB_NAME: flowpilot
      FLOWPILOT_DB_USERNAME: flowpilot
      FLOWPILOT_DB_PASSWORD: ci-ephemeral-db-password
      FLOWPILOT_JWT_SECRET: ci-ephemeral-jwt-secret-flowpilot-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Wait for the backend to accept requests
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
              -H "Content-Type: application/json" -d '{"email":"x","password":"x"}' || true)
            if [ "$code" = "400" ] || [ "$code" = "401" ]; then
              echo "backend is up (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "backend never became ready" >&2
          docker compose logs backend
          exit 1
      - name: Wait for the frontend TLS listener (WebKit e2e origin)
        run: |
          for i in $(seq 1 20); do
            if curl -sk -o /dev/null https://localhost/; then
              echo "frontend https is up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend https never became ready" >&2
          docker compose logs frontend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive e2e suite
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
