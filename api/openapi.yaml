openapi: 3.1.0
info:
  title: FlowPilot API
  version: 0.1.0
  description: >
    Contract-first REST API for FlowPilot. Paths and schemas are added slice
    by slice. PR1 adds Auth, PR2 adds the read-only user directory, PR3 adds
    Projects + BoardColumns, PR4 adds project Members, PR5 adds WorkItems.
    Hand-authored here is the source of truth; springdoc-openapi runs in CI
    only as a drift check against the running application (see
    OpenApiSpecExportTest + the oasdiff step in ci.yml). Paths below are
    absolute (include the /api prefix baked into every @RequestMapping) —
    there is no servers/context-path indirection, since the live
    springdoc-generated document has none either.
paths:
  /api/auth/register:
    post:
      summary: Self-service registration
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/auth/login:
    post:
      summary: Login and issue tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Access token issued; refresh cookie set along with a readable-by-JS
            XSRF-TOKEN cookie (double-submit CSRF pattern, design decision D8).
            The client must echo the XSRF-TOKEN cookie value back as the
            X-XSRF-TOKEN header on subsequent /auth/refresh and /auth/logout
            calls.
          headers:
            Set-Cookie:
              description: Sets refreshToken (HttpOnly) and XSRF-TOKEN (readable) cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid credentials or deactivated account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many failed login attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      description: >-
        Cookie-authenticated (no Bearer token). Requires the double-submit
        CSRF header per design decision D8: the caller must send
        X-XSRF-TOKEN with the same value as the XSRF-TOKEN cookie set on
        login/refresh, or the request is rejected with 403.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Must match the value of the XSRF-TOKEN cookie (double-submit CSRF check)
          schema:
            type: string
      responses:
        '200':
          description: New access token issued; refresh cookie and XSRF-TOKEN cookie rotated
          headers:
            Set-Cookie:
              description: Sets refreshToken (HttpOnly) and XSRF-TOKEN (readable) cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Missing, expired, revoked, reused, or inactive-user refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Missing or mismatched X-XSRF-TOKEN header (CSRF check failed)
  /api/auth/logout:
    post:
      summary: Revoke the refresh token and clear the cookie
      operationId: logout
      description: >-
        Cookie-authenticated (no Bearer token). Requires the double-submit
        CSRF header per design decision D8, same as /auth/refresh.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Must match the value of the XSRF-TOKEN cookie (double-submit CSRF check)
          schema:
            type: string
      responses:
        '204':
          description: Logged out; refreshToken and XSRF-TOKEN cookies cleared
        '403':
          description: Missing or mismatched X-XSRF-TOKEN header (CSRF check failed)
  /api/auth/forgot-password:
    post:
      summary: Request a password reset (always 200, no account enumeration)
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Always returned, regardless of whether the account exists
        '429':
          description: Too many password-reset requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/auth/reset-password:
    post:
      summary: Reset password using a valid reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated; all refresh tokens revoked
        '400':
          description: Unknown, expired, or already-used reset token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users:
    get:
      summary: List users (read-only directory, for member selection)
      operationId: listUsers
      description: >-
        Requires a valid Bearer access token from an active caller — no
        special global role or project permission on the target (interim
        rule until the slice 8 permission matrix exists). Returns both active
        and inactive users.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller's account is deactivated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/{id}:
    get:
      summary: Get a single user by id
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller's account is deactivated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No user with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/me:
    get:
      summary: Get the authenticated caller's own profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller's account is deactivated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/users/me/password:
    put:
      summary: Change the authenticated caller's own password
      operationId: changePassword
      description: >-
        Verifies currentPassword against the stored hash before re-hashing
        (rate-limited per caller). Rejects a newPassword equal to
        currentPassword. On success, revokes all of the caller's active
        refresh tokens (same as /api/auth/reset-password) and issues a fresh
        one for the current session, set as the refreshToken cookie —
        otherwise the browser would keep presenting a now-revoked cookie.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: >-
            Password updated; all refresh tokens revoked and a fresh one set
            as the refreshToken cookie for the current session
        '400':
          description: Validation failed, current password is incorrect, or newPassword equals currentPassword
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller's account is deactivated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Too many incorrect currentPassword attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/admin/users:
    get:
      summary: List all users with full admin projection (role, active) — admin-only
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAdminResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not a global Administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/admin/users/{id}/status:
    patch:
      summary: Activate or deactivate a user — admin-only
      operationId: setUserStatus
      description: >-
        Rejects the change with 409 if it would leave zero active
        Administradores (spec: user-administration, last-Administrador
        lockout guard). Self-deactivation is allowed unless the caller is the
        last active Administrador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not a global Administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No user with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Would leave zero active Administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/admin/users/{id}/role:
    put:
      summary: Change a user's global role — admin-only
      operationId: setUserRole
      description: >-
        Rejects a demotion away from Administrador with 409 if it would
        leave zero active Administradores (spec: user-administration,
        last-Administrador lockout guard). Self-demotion is allowed unless
        the caller is the last active Administrador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not a global Administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No user with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Would leave zero active Administradores
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/admin/role-permissions:
    get:
      summary: Get the full 6x11 role/permission matrix — admin-only
      operationId: getRolePermissions
      description: >-
        Returns the fixed role/permission catalogs (for rendering the admin
        grid) plus all 66 grant rows and MAX(role_permissions.updated_at),
        which the caller must echo back as expectedUpdatedAt on PUT
        (optimistic concurrency, spec: role-permissions).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionMatrixResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not a global Administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Bulk atomic replace of every grant in the matrix — admin-only
      operationId: replaceRolePermissions
      description: >-
        Replaces every submitted (role, permission) grant in one atomic
        transaction and evicts ProjectAuthorizationService's in-process
        cache so the new grants apply without a restart (spec:
        role-permissions, "Bulk update success"). Rejects with 409 and
        applies nothing if expectedUpdatedAt no longer matches the
        persisted MAX(updated_at) — another admin wrote the matrix since
        the caller loaded it ("Concurrent conflicting edit" scenario).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionUpdateRequest'
      responses:
        '200':
          description: Matrix replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionMatrixResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not a global Administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: expectedUpdatedAt is stale — matrix changed since it was loaded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects:
    get:
      summary: List projects visible to the caller
      operationId: listProjects
      description: >-
        Global administrators see every project; everyone else sees only
        projects they own. The list endpoint's ownership filter is unchanged
        by slice 4; single-resource reads (GET /projects/{id} and
        /board-columns) now also require admin/owner/member (see below).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Create a project
      operationId: createProject
      description: >-
        The caller becomes the project's owner. Seeds exactly 4 default
        BoardColumns ("Por hacer", "En progreso", "En revisión", "Terminado")
        atomically in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created, 4 BoardColumns seeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Validation failed, or start date is after estimated end date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Code already belongs to another project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{id}:
    get:
      summary: Get a project by id
      operationId: getProject
      description: >-
        Requires the caller to be a global administrator, the project's
        owner, or a ProjectMember of the project (closes the read-gap
        flagged in the slice-3 verify report: previously authentication-only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Update a project's name/description
      operationId: updateProject
      description: >-
        Requires the PROJECT_EDIT_SETTINGS permission (role-permission
        matrix): a global administrator or the project's owner always has
        it, and by default so does the PROJECT_MANAGER project role
        (design's ProjectAuthorizationService).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Validation failed, or start date is after estimated end date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Code already belongs to another project, or the project was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete a project
      operationId: deleteProject
      description: >-
        Requires the PROJECT_DELETE permission (role-permission matrix): a
        global administrator or the project's owner always has it;
        PROJECT_DELETE is granted to no project role by default, but an
        administrator may grant it to any role via the matrix.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Project deleted
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{id}/status:
    patch:
      summary: Transition a project's lifecycle status
      operationId: updateProjectStatus
      description: >-
        Requires the PROJECT_EDIT_SETTINGS permission (role-permission
        matrix), the same gate as updating the project itself.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{id}/board-columns:
    get:
      summary: List a project's Kanban columns, ordered by position
      operationId: listBoardColumns
      description: >-
        Read-only. Exactly 4 columns are seeded on project creation
        (design decision 9). Consumed by the future Kanban board slice.
        Requires the same admin/owner/member view gate as GET /projects/{id}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Board columns ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardColumnResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/members:
    get:
      summary: List a project's members
      operationId: listProjectMembers
      description: >-
        Requires the caller to be a global administrator, the project's
        owner, or an existing ProjectMember.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Add a member to a project
      operationId: addProjectMember
      description: >-
        Requires the MEMBER_ADD permission (role-permission matrix): a
        global administrator or the project's owner always has it, and by
        default so does the PROJECT_MANAGER project role. Rejects duplicate
        memberships with 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberAddRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id, or no user with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: User is already a member of this project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/members/{userId}:
    put:
      summary: Change a member's role in place
      operationId: changeProjectMemberRole
      description: >-
        Requires the MEMBER_CHANGE_ROLE permission (role-permission matrix):
        a global administrator or the project's owner always has it, and by
        default so does the PROJECT_MANAGER project role. joinedAt is
        preserved. A caller can never change their own role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRoleUpdateRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: >-
            Caller lacks the required permission for this project (admin,
            owner, or a matrix-granted role), or is trying to change their
            own role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id, or no such member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The member's role was changed concurrently
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Remove a member from a project
      operationId: removeProjectMember
      description: >-
        Requires the MEMBER_REMOVE permission (role-permission matrix): a
        global administrator or the project's owner always has it, and by
        default so does the PROJECT_MANAGER project role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '204':
          description: Member removed
        '403':
          description: Caller lacks the required permission for this project (admin, owner, or a matrix-granted role)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id, or no such member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/sprints:
    get:
      summary: List project sprints
      operationId: listSprints
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NestedProjectId' }]
      responses:
        '200': { description: Project sprints, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SprintResponse' } } } } }
        '403': { description: Forbidden }
    post:
      summary: Create a planned sprint
      operationId: createSprint
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/NestedProjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SprintCreateRequest' } } } }
      responses:
        '201': { description: Sprint created, content: { application/json: { schema: { $ref: '#/components/schemas/SprintResponse' } } } }
        '400': { description: Invalid dates }
        '403': { description: Forbidden }
  /api/sprints/{id}:
    put:
      summary: Update a planned sprint
      operationId: updateSprint
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SprintUpdateRequest' } } } }
      responses: { '200': { description: Sprint updated, content: { application/json: { schema: { $ref: '#/components/schemas/SprintResponse' } } } } }
  /api/sprints/{id}/start:
    post:
      summary: Start a planned sprint
      operationId: startSprint
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      responses: { '200': { description: Sprint activated, content: { application/json: { schema: { $ref: '#/components/schemas/SprintResponse' } } } }, '400': { description: Invalid transition or active sprint already exists } }
  /api/sprints/{id}/complete:
    post:
      summary: Complete an active sprint
      operationId: completeSprint
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      responses: { '200': { description: Sprint completed, content: { application/json: { schema: { $ref: '#/components/schemas/SprintResponse' } } } }, '400': { description: Invalid transition } }
  /api/projects/{projectId}/ai/user-stories:
    post:
      summary: Generate a non-persisted user-story draft from a free-text requirement
      operationId: generateUserStory
      description: >-
        Turns a free-text requirement into a single user story plus acceptance
        criteria. Guarded by the project WORKITEM_CREATE permission (checked in
        AiUserStoryService, not the controller). Persists nothing — no work
        item, comment, or activity row is written. When flowpilot.ai.enabled is
        false the deterministic stub answers (generatedBy=STUB); when true the
        configured Ollama model answers (generatedBy=OLLAMA). The user edits the
        draft and confirms via POST /api/projects/{projectId}/work-items.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateUserStoryRequest'
      responses:
        '200':
          description: Generated draft, nothing persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedUserStoryResponse'
        '400':
          description: requirement blank or longer than 2000 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks WORKITEM_CREATE on this project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: >-
            AI assistant unavailable — the LLM refused the connection, exceeded
            the connect/read timeout, returned a non-2xx status, or produced
            unparseable output. No retry is attempted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/ai/subtasks:
    post:
      summary: Generate a non-persisted subtask breakdown from a story or pasted text
      operationId: generateSubtasks
      description: >-
        Breaks a user story into 1..10 subtask drafts. Accepts exactly one of
        workItemId (mode a: an existing story in the project) or storyText
        (mode b: pasted text). Guarded by the project WORKITEM_CREATE permission
        (checked in AiSubtaskService, not the controller); a work item that is
        not in projectId returns 404, and a source story that is itself a
        subtask returns 400. Persists nothing — no work item, comment, or
        activity row is written. When flowpilot.ai.enabled is false the
        deterministic stub answers (generatedBy=STUB); when true the configured
        Ollama model answers (generatedBy=OLLAMA). The caller edits the drafts
        and confirms them through POST /api/projects/{projectId}/work-items/batch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSubtasksRequest'
      responses:
        '200':
          description: Generated subtask drafts, nothing persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedSubtasksResponse'
        '400':
          description: >-
            Not exactly one of workItemId/storyText was supplied, storyText is
            longer than 4000 characters, or the source story is itself a subtask
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks WORKITEM_CREATE on this project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id, or no such work item in that project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: >-
            AI assistant unavailable — the LLM refused the connection, exceeded
            the connect/read timeout, returned a non-2xx status, or produced
            unparseable or empty output. No retry is attempted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/ai/config:
    get:
      summary: Report whether AI-assisted planning is enabled
      operationId: getAiConfig
      description: >-
        Authenticated read used by the frontend to show or hide the AI
        user-story entrypoint. Reflects the flowpilot.ai.enabled flag.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current AI availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConfigResponse'
        '401':
          description: No or invalid bearer token
  /api/projects/{projectId}/work-items:
    get:
      summary: List a project's work items
      operationId: listWorkItems
      description: >-
        Requires the same admin/owner/member view gate as GET /projects/{id}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      responses:
        '200':
          description: Work items, ordered by column then within-column position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Create a work item
      operationId: createWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may create a work item — task
        management must stay usable by the whole team, not just the project
        owner. The item is always created in the project's first
        (lowest-position) BoardColumn; moving between columns is a separate
        slice-6 endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NestedProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemCreateRequest'
      responses:
        '201':
          description: Work item created in the project's first column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/work-items/{id}:
    get:
      summary: Get a work item by id
      operationId: getWorkItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Work item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member of the parent project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Update a work item's title/description/assignee
      operationId: updateWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may edit. Does NOT accept
        columnId/position — moving is the separate slice-6
        PUT /work-items/{id}/move endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemUpdateRequest'
      responses:
        '200':
          description: Work item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete a work item
      operationId: deleteWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may delete.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '204':
          description: Work item deleted
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: >-
            The work item still has subtasks. Clear or reassign the child
            links first. The detail names the exact child count.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/work-items/{id}/move:
    put:
      summary: Move a work item to a column and/or position
      operationId: moveWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may move. Validates that columnId
        belongs to the SAME project as the work item; a cross-project column
        is rejected with 400 and no change. position is the desired
        zero-based insertion index within the target column's existing
        items (the moved item itself excluded), translated server-side into
        a gap-based position (1024 step; the target column is fully
        re-sequenced only when the computed gap would be less than 2).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemMoveRequest'
      responses:
        '200':
          description: >-
            Work item moved; columnId and position persisted. affectedItems
            is populated only when the target column's siblings were
            re-sequenced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '400':
          description: columnId belongs to a different project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item or no target column with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/dashboard:
    get:
        summary: Get project dashboard aggregates
        operationId: getProjectDashboard
        parameters:
          - in: path
            name: projectId
            required: true
            schema: {type: integer, format: int64}
        responses:
          '200':
            description: Dashboard metrics
            content:
              application/json:
                schema: {$ref: '#/components/schemas/ProjectDashboardResponse'}
          '401':
            description: Missing or invalid access token
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
          '403': {description: Not authorized}
          '404':
            description: No project with that id
            content:
              application/problem+json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
  /api/projects/{projectId}/comments:
    get:
      summary: List project comments, newest first
      operationId: listProjectComments
      description: >-
        Requires the caller to be able to view the project (admin, owner, or
        an existing ProjectMember).
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/NestedProjectId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CommentResponse'}
        '400':
          description: limit/offset out of range
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller cannot view this project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      summary: Create a project comment
      operationId: createProjectComment
      description: Requires the COMMENT_CREATE permission (role-permission matrix).
      security:
        - bearerAuth: []
      parameters: [{ $ref: '#/components/parameters/NestedProjectId' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreateRequest'}}}}
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentResponse'}
        '400':
          description: content blank or over 4000 characters
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller lacks the COMMENT_CREATE permission for this project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/work-items/{workItemId}/comments:
    get:
      summary: List work-item comments, newest first
      operationId: listWorkItemComments
      description: >-
        Requires the caller to be able to view the work item's parent
        project (admin, owner, or an existing ProjectMember).
      security:
        - bearerAuth: []
      parameters:
        - {name: workItemId, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CommentResponse'}
        '400':
          description: limit/offset out of range
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller cannot view the work item's parent project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      summary: Create a work-item comment
      operationId: createWorkItemComment
      description: Requires the COMMENT_CREATE permission (role-permission matrix) on the work item's parent project.
      security:
        - bearerAuth: []
      parameters: [{name: workItemId, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentCreateRequest'}}}}
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentResponse'}
        '400':
          description: content blank or over 4000 characters
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller lacks the COMMENT_CREATE permission for the work item's parent project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/comments/{commentId}:
    put:
      summary: Edit own comment
      operationId: updateComment
      description: >-
        Requires the caller to be the comment's author AND still hold the
        COMMENT_CREATE permission on the parent project (a role that has had
        COMMENT_CREATE revoked can no longer edit its own past comments).
      security:
        - bearerAuth: []
      parameters: [{name: commentId, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentUpdateRequest'}}}}
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentResponse'}
        '400':
          description: content blank or over 4000 characters
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller is not the comment's author, cannot view the parent project, or lacks COMMENT_CREATE
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No comment with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    delete:
      summary: Delete own comment
      operationId: deleteComment
      description: Requires the caller to be the comment's author.
      security:
        - bearerAuth: []
      parameters: [{name: commentId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '204':
          description: Comment deleted
        '403':
          description: Caller is not the comment's author, or cannot view the parent project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No comment with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/projects/{projectId}/activity:
    get:
      summary: List project activity, newest first
      operationId: listProjectActivity
      description: >-
        Requires the caller to be able to view the project (admin, owner, or
        an existing ProjectMember).
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/NestedProjectId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Activity events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: limit/offset out of range
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Caller cannot view this project
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema: {type: integer, format: int32, minimum: 0, default: 0}
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    NestedProjectId:
      name: projectId
      in: path
      required: true
      description: >-
        Same conceptual project id as ProjectId, but named projectId here
        because that's the literal @RequestMapping path-variable name on
        ProjectMemberController/WorkItemController's nested-under-project
        routes (unlike ProjectController's own routes, which use {id}).
      schema:
        type: integer
        format: int64
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SprintId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    WorkItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 4000}
    CommentUpdateRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 4000}
    CommentResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        workItemId: {type: integer, format: int64, nullable: true}
        authorId: {type: integer, format: int64}
        authorName: {type: string, nullable: true}
        content: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ActivityResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        projectId: {type: integer, format: int64}
        actorId: {type: integer, format: int64}
        eventType:
          type: string
          enum:
            - PROJECT_CREATED
            - PROJECT_UPDATED
            - PROJECT_STATUS_CHANGED
            - WORK_ITEM_CREATED
            - WORK_ITEM_UPDATED
            - WORK_ITEM_STATUS_CHANGED
            - WORK_ITEM_MOVED
            - WORK_ITEM_DELETED
            - MEMBER_ADDED
            - MEMBER_REMOVED
            - MEMBER_ROLE_CHANGED
            - SPRINT_CREATED
            - SPRINT_UPDATED
            - SPRINT_STARTED
            - SPRINT_COMPLETED
            - COMMENT_CREATED
            - COMMENT_UPDATED
            - COMMENT_DELETED
        displayText: {type: string}
        payload: {type: string}
        createdAt: {type: string, format: date-time}
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    UserSummaryResponse:
      type: object
      description: >-
        Lightweight user-directory projection. Deliberately excludes
        passwordHash, role, active, and any other sensitive/internal field.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    GlobalRole:
      type: string
      enum: [ADMINISTRADOR, MIEMBRO_EQUIPO]
    UserAdminResponse:
      type: object
      description: >-
        Full admin-facing user projection (spec: user-administration).
        Unlike UserSummaryResponse this exposes role and active.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/GlobalRole'
        active:
          type: boolean
    UserStatusUpdateRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    UserRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/GlobalRole'
    ProjectStatus:
      type: string
      enum: [PLANIFICACION, ACTIVO, PAUSADO, FINALIZADO, CANCELADO]
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        code:
          type: string
          maxLength: 50
          pattern: '^[A-Za-z0-9_-]*$'
        startDate:
          type: string
          format: date
        estimatedEndDate:
          type: string
          format: date
        technologies:
          type: string
          maxLength: 1000
        repositoryUrl:
          type: string
          maxLength: 500
          pattern: '^$|^https?://\S+$'
    ProjectUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        code:
          type: string
          maxLength: 50
          pattern: '^[A-Za-z0-9_-]*$'
        startDate:
          type: string
          format: date
        estimatedEndDate:
          type: string
          format: date
        technologies:
          type: string
          maxLength: 1000
        repositoryUrl:
          type: string
          maxLength: 500
          pattern: '^$|^https?://\S+$'
    ProjectStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        ownerId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        code:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        estimatedEndDate:
          type: string
          format: date
          nullable: true
        technologies:
          type: string
          nullable: true
        repositoryUrl:
          type: string
          nullable: true
        callerPermissions:
          type: array
          description: >-
            The permissions the CALLING user holds for THIS project — not the
            full catalog and not another role's grants. Lets clients gate
            destructive/mutating controls proactively instead of discovering
            a lack of permission only via a 403.
          items:
            $ref: '#/components/schemas/Permission'
    BoardColumnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        position:
          type: integer
          format: int32
    ProjectRole:
      type: string
      description: >-
        Project-scoped role. Since slice 8a, each role's permissions are
        matrix-backed (role_permissions table) rather than hardcoded.
      enum:
        [PRODUCT_OWNER, PROJECT_MANAGER, DEVELOPER, UX_UI_DESIGNER, QA, DEVOPS]
    Permission:
      type: string
      description: "Fixed, code-level catalog of project-scoped permissions (spec: role-permissions)."
      enum:
        - PROJECT_EDIT_SETTINGS
        - PROJECT_DELETE
        - MEMBER_ADD
        - MEMBER_REMOVE
        - MEMBER_CHANGE_ROLE
        - WORKITEM_CREATE
        - WORKITEM_EDIT
        - WORKITEM_DELETE
        - WORKITEM_MOVE
        - COMMENT_CREATE
        - SPRINT_MANAGE
    RolePermissionCatalogEntry:
      type: object
      description: Rendering metadata for one fixed catalog Permission. UI copy in Spanish.
      properties:
        key:
          $ref: '#/components/schemas/Permission'
        label:
          type: string
        description:
          type: string
    RolePermissionGrant:
      type: object
      description: One (role, permission) grant cell.
      required: [role, permission, granted]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
        permission:
          $ref: '#/components/schemas/Permission'
        granted:
          type: boolean
    RolePermissionMatrixResponse:
      type: object
      description: >-
        Full 6x11 permission matrix (spec: role-permissions). updatedAt is
        MAX(role_permissions.updated_at) — echo it back as
        expectedUpdatedAt on PUT.
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ProjectRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RolePermissionCatalogEntry'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RolePermissionGrant'
        updatedAt:
          type: string
          format: date-time
    RolePermissionUpdateRequest:
      type: object
      description: Bulk atomic-replace payload for PUT /admin/role-permissions.
      required: [grants]
      properties:
        grants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RolePermissionGrant'
        expectedUpdatedAt:
          type: [string, 'null']
          format: date-time
    ProjectMemberAddRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectMemberRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ProjectRole'
        joinedAt:
          type: string
          format: date-time
    SprintStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED]
    SprintCreateRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, minLength: 1 }
        goal: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    SprintUpdateRequest:
      $ref: '#/components/schemas/SprintCreateRequest'
    SprintResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        name: { type: string }
        goal: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/SprintStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkItemPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    AiProvider:
      type: string
      enum: [STUB, OLLAMA]
    GenerateUserStoryRequest:
      type: object
      description: >-
        Free-text requirement to turn into a user story. Treated purely as
        content to analyse, never as instructions to the model.
      required: [requirement]
      properties:
        requirement:
          type: string
          minLength: 0
          maxLength: 2000
    UserStoryDraft:
      type: object
      description: >-
        Parts of the story plus the backend-composed Spanish sentence. text is
        always "Como {role} quiero {action} para {benefit}" — the model never
        writes the sentence itself.
      properties:
        role:
          type: string
        action:
          type: string
        benefit:
          type: string
        text:
          type: string
    GeneratedUserStoryResponse:
      type: object
      description: >-
        Non-persisted draft. model is the Ollama model name for an OLLAMA draft
        and null for a STUB draft.
      properties:
        userStory:
          $ref: '#/components/schemas/UserStoryDraft'
        acceptanceCriteria:
          type: array
          items:
            type: string
        generatedBy:
          $ref: '#/components/schemas/AiProvider'
        model:
          type: string
          nullable: true
    GenerateSubtasksRequest:
      type: object
      description: >-
        Exactly one of workItemId (mode a) or storyText (mode b) must be
        present; both or neither is a 400. Text is treated purely as content to
        analyse, never as instructions to the model.
      properties:
        workItemId:
          type: [integer, 'null']
          format: int64
        storyText:
          type: [string, 'null']
          minLength: 0
          maxLength: 4000
    SubtaskDraft:
      type: object
      description: >-
        One non-persisted subtask draft. description is never null — an absent
        model description becomes "".
      properties:
        title:
          type: string
        description:
          type: string
    GeneratedSubtasksResponse:
      type: object
      description: >-
        Non-persisted list of 1..10 subtask drafts. model is the Ollama model
        name for an OLLAMA result and null for a STUB result.
      properties:
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/SubtaskDraft'
        generatedBy:
          $ref: '#/components/schemas/AiProvider'
        model:
          type: string
          nullable: true
    AiConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
    ProjectDashboardResponse:
      type: object
      properties:
        totalItems: {type: integer, format: int64}
        completedItems: {type: integer, format: int64}
        columnCounts: {type: array, items: {$ref: '#/components/schemas/ColumnCount'}}
        activeSprint:
          allOf: [{$ref: '#/components/schemas/SprintSummary'}]
          nullable: true
        activeSprintTotalItems: {type: integer, format: int64}
        activeSprintCompletedItems: {type: integer, format: int64}
        backlogPendingCount: {type: integer, format: int64}
        workload: {type: array, items: {$ref: '#/components/schemas/AssigneeWorkload'}}
        priorityDistribution: {type: object, additionalProperties: {type: integer, format: int64}}
    ColumnCount:
      type: object
      properties:
        columnId: {type: integer, format: int64}
        name: {type: string}
        count: {type: integer, format: int64}
    AssigneeWorkload:
      type: object
      properties:
        assigneeId: {type: integer, format: int64}
        assigneeName: {type: string, nullable: true}
        count: {type: integer, format: int64}
    SprintSummary:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        goal: {type: string, nullable: true}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
    WorkItemCreateRequest:
      type: object
      description: >-
        No columnId — the item always lands in the project's first seeded
        BoardColumn (spec: work-items).
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedUserId:
          type: integer
          format: int64
        sprintId:
          type: [integer, 'null']
          format: int64
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptanceCriteria:
          type: array
          description: >-
            Ordered acceptance criteria. Optional; omitted or null is stored as
            an empty list. Never folded into description.
          items:
            type: string
        aiGenerated:
          type: [boolean, 'null']
          description: >-
            Client-asserted provenance flag set when confirming an AI draft.
            Omitted or null is stored as false.
        aiModel:
          type: [string, 'null']
          description: >-
            Client-asserted model name for an AI-generated item; null for
            manual creation or a STUB draft.
        parentWorkItemId:
          type: [integer, 'null']
          format: int64
          description: >-
            Optional single-level parent link. When set, the created item
            becomes a subtask of that work item; the parent must be in the
            same project, must not already be a subtask, and the new item
            must not itself have children.
    WorkItemUpdateRequest:
      type: object
      description: >-
        Excludes columnId/position — those are mutated only by the slice-6
        move endpoint.
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedUserId:
          type: integer
          format: int64
        sprintId:
          type: [integer, 'null']
          format: int64
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptanceCriteria:
          type: array
          description: >-
            Ordered acceptance criteria. Optional; omitted or null replaces the
            stored list with an empty list.
          items:
            type: string
        parentWorkItemId:
          type: [integer, 'null']
          format: int64
          description: >-
            Single-level parent link. Set to link (or re-link) this item as a
            subtask, null to clear it. Same validation as create.
    WorkItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        columnId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        assignedUserId:
          type: integer
          format: int64
        assignedUserName:
          type: string
          nullable: true
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sprintId:
          type: integer
          format: int64
          nullable: true
        priority:
          $ref: '#/components/schemas/WorkItemPriority'
        acceptanceCriteria:
          type: array
          description: >-
            Ordered acceptance criteria; empty list when none were set. Stored
            as jsonb, never folded into description.
          items:
            type: string
        aiGenerated:
          type: boolean
          description: Client-asserted provenance flag; false for manual creation.
        aiModel:
          type: string
          nullable: true
          description: >-
            Client-asserted model name for an AI-generated item; null
            otherwise.
        affectedItems:
          type: array
          nullable: true
          description: >-
            Populated only by PUT /api/work-items/{id}/move when the target
            column's siblings were re-sequenced (design D10); null/absent
            otherwise, including for every non-move response.
          items:
            $ref: '#/components/schemas/WorkItemResponse'
        parentWorkItemId:
          type: integer
          format: int64
          nullable: true
          description: Single-level parent link; null when the item has no parent.
        parentWorkItemTitle:
          type: string
          nullable: true
          description: >-
            Title of the parent work item; null when the item has no parent.
            May be null on a move response.
        childCount:
          type: integer
          format: int64
          description: >-
            Number of direct subtasks. 0 when none. May be 0 on a move
            response.
    WorkItemMoveRequest:
      type: object
      description: >-
        position is the desired zero-based insertion index within the
        target column's existing items (the moved item itself excluded),
        not a raw gap-based position value.
      required: [columnId, position]
      properties:
        columnId:
          type: integer
          format: int64
        position:
          type: integer
          format: int32
          minimum: 0
  responses: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
