openapi: 3.1.0
info:
  title: FlowPilot API
  version: 0.1.0
  description: >
    Contract-first REST API for FlowPilot. Paths and schemas are added slice
    by slice. PR1 adds Auth, PR2 adds the read-only user directory, PR3 adds
    Projects + BoardColumns, PR4 adds project Members, PR5 adds WorkItems.
    Hand-authored here is the source of truth; springdoc-openapi runs in CI
    only as a drift check against the running application.
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Self-service registration
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/login:
    post:
      summary: Login and issue tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Access token issued; refresh cookie set along with a readable-by-JS
            XSRF-TOKEN cookie (double-submit CSRF pattern, design decision D8).
            The client must echo the XSRF-TOKEN cookie value back as the
            X-XSRF-TOKEN header on subsequent /auth/refresh and /auth/logout
            calls.
          headers:
            Set-Cookie:
              description: Sets refreshToken (HttpOnly) and XSRF-TOKEN (readable) cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid credentials or deactivated account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      description: >-
        Cookie-authenticated (no Bearer token). Requires the double-submit
        CSRF header per design decision D8: the caller must send
        X-XSRF-TOKEN with the same value as the XSRF-TOKEN cookie set on
        login/refresh, or the request is rejected with 403.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Must match the value of the XSRF-TOKEN cookie (double-submit CSRF check)
          schema:
            type: string
      responses:
        '200':
          description: New access token issued; refresh cookie and XSRF-TOKEN cookie rotated
          headers:
            Set-Cookie:
              description: Sets refreshToken (HttpOnly) and XSRF-TOKEN (readable) cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Missing, expired, revoked, reused, or inactive-user refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Missing or mismatched X-XSRF-TOKEN header (CSRF check failed)
  /auth/logout:
    post:
      summary: Revoke the refresh token and clear the cookie
      operationId: logout
      description: >-
        Cookie-authenticated (no Bearer token). Requires the double-submit
        CSRF header per design decision D8, same as /auth/refresh.
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Must match the value of the XSRF-TOKEN cookie (double-submit CSRF check)
          schema:
            type: string
      responses:
        '204':
          description: Logged out; refreshToken and XSRF-TOKEN cookies cleared
        '403':
          description: Missing or mismatched X-XSRF-TOKEN header (CSRF check failed)
  /auth/forgot-password:
    post:
      summary: Request a password reset (always 200, no account enumeration)
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Always returned, regardless of whether the account exists
  /auth/reset-password:
    post:
      summary: Reset password using a valid reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated; all refresh tokens revoked
        '400':
          description: Unknown, expired, or already-used reset token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users:
    get:
      summary: List users (read-only directory, for member selection)
      operationId: listUsers
      description: >-
        Requires a valid Bearer access token — no special global role or
        project permission (interim rule until the slice 8 permission matrix
        exists). Returns both active and inactive users.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/{id}:
    get:
      summary: Get a single user by id
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No user with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects:
    get:
      summary: List projects visible to the caller
      operationId: listProjects
      description: >-
        Global administrators see every project; everyone else sees only
        projects they own. The list endpoint's ownership filter is unchanged
        by slice 4; single-resource reads (GET /projects/{id} and
        /board-columns) now also require admin/owner/member (see below).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Create a project
      operationId: createProject
      description: >-
        The caller becomes the project's owner. Seeds exactly 4 default
        BoardColumns ("Por hacer", "En progreso", "En revisión", "Terminado")
        atomically in the same transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created, 4 BoardColumns seeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}:
    get:
      summary: Get a project by id
      operationId: getProject
      description: >-
        Requires the caller to be a global administrator, the project's
        owner, or a ProjectMember of the project (closes the read-gap
        flagged in the slice-3 verify report: previously authentication-only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Update a project's name/description
      operationId: updateProject
      description: >-
        Only the project's owner or a global administrator may edit
        (interim owner rule, design's ProjectAuthorizationService).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete a project
      operationId: deleteProject
      description: >-
        Only the project's owner or a global administrator may delete
        (PROJECT_DELETE is granted to no role in the future permission
        matrix; owner/admin coverage is interim + permanent per the design).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Project deleted
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}/status:
    patch:
      summary: Transition a project's lifecycle status
      operationId: updateProjectStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}/board-columns:
    get:
      summary: List a project's Kanban columns, ordered by position
      operationId: listBoardColumns
      description: >-
        Read-only. Exactly 4 columns are seeded on project creation
        (design decision 9). Consumed by the future Kanban board slice.
        Requires the same admin/owner/member view gate as GET /projects/{id}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Board columns ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardColumnResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}/members:
    get:
      summary: List a project's members
      operationId: listProjectMembers
      description: >-
        Requires the caller to be a global administrator, the project's
        owner, or an existing ProjectMember.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Add a member to a project
      operationId: addProjectMember
      description: >-
        Only the project's owner or a global administrator may add members
        (interim rule, same seam as project PUT/DELETE). Rejects duplicate
        memberships with 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberAddRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: User is already a member of this project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}/members/{userId}:
    put:
      summary: Change a member's role in place
      operationId: changeProjectMemberRole
      description: >-
        Only the project's owner or a global administrator may change a
        member's role. joinedAt is preserved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRoleUpdateRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No such member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Remove a member from a project
      operationId: removeProjectMember
      description: >-
        Only the project's owner or a global administrator may remove a
        member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MemberUserId'
      responses:
        '204':
          description: Member removed
        '403':
          description: Caller is not the owner or an administrator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No such member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /projects/{id}/work-items:
    get:
      summary: List a project's work items
      operationId: listWorkItems
      description: >-
        Requires the same admin/owner/member view gate as GET /projects/{id}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Work items, ordered by column then within-column position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Create a work item
      operationId: createWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may create a work item — task
        management must stay usable by the whole team, not just the project
        owner. The item is always created in the project's first
        (lowest-position) BoardColumn; moving between columns is a separate
        slice-6 endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemCreateRequest'
      responses:
        '201':
          description: Work item created in the project's first column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No project with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /work-items/{id}:
    get:
      summary: Get a work item by id
      operationId: getWorkItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Work item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member of the parent project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Update a work item's title/description/assignee
      operationId: updateWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may edit. Does NOT accept
        columnId/position — moving is the separate slice-6
        PUT /work-items/{id}/move endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemUpdateRequest'
      responses:
        '200':
          description: Work item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete a work item
      operationId: deleteWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may delete.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '204':
          description: Work item deleted
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /work-items/{id}/move:
    put:
      summary: Move a work item to a column and/or position
      operationId: moveWorkItem
      description: >-
        Any project member (owner, a global administrator, or a live
        ProjectMember of the project) may move. Validates that columnId
        belongs to the SAME project as the work item; a cross-project column
        is rejected with 400 and no change. position is the desired
        zero-based insertion index within the target column's existing
        items (the moved item itself excluded), translated server-side into
        a gap-based position (1024 step; the target column is fully
        re-sequenced only when the computed gap would be less than 2).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemMoveRequest'
      responses:
        '200':
          description: Work item moved; columnId and position persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '400':
          description: columnId belongs to a different project
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller is not the owner, an administrator, or a member
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No work item or no target column with that id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    WorkItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    UserSummaryResponse:
      type: object
      description: >-
        Lightweight user-directory projection. Deliberately excludes
        passwordHash, role, active, and any other sensitive/internal field.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    ProjectStatus:
      type: string
      enum: [PLANIFICACION, ACTIVO, PAUSADO, FINALIZADO, CANCELADO]
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    ProjectUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    ProjectStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        ownerId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BoardColumnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        position:
          type: integer
    ProjectRole:
      type: string
      description: >-
        Descriptive label only in the MVP — not yet permission-bearing
        (the permission matrix lands in slice 8a).
      enum:
        [PRODUCT_OWNER, PROJECT_MANAGER, DEVELOPER, UX_UI_DESIGNER, QA, DEVOPS]
    ProjectMemberAddRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectMemberRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ProjectRole'
        joinedAt:
          type: string
          format: date-time
    WorkItemCreateRequest:
      type: object
      description: >-
        No columnId — the item always lands in the project's first seeded
        BoardColumn (spec: work-items).
