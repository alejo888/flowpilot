@if (authStore.isAuthenticated()) {
  <header class="app-topbar" data-testid="app-topbar">
    <a routerLink="/" class="app-topbar__brand">FlowPilot</a>
    <button
      type="button"
      class="app-topbar__toggle"
      data-testid="nav-toggle"
      [attr.aria-expanded]="drawerOpen()"
      aria-label="Abrir menú"
      (click)="toggleDrawer()"
    >
      ☰
    </button>
  </header>

  @if (drawerOpen()) {
    <button
      type="button"
      class="app-sidebar__scrim"
      data-testid="app-sidebar-scrim"
      aria-label="Cerrar menú"
      (click)="closeDrawer()"
    ></button>
  }

  <aside class="app-sidebar" [class.app-sidebar--open]="drawerOpen()" data-testid="app-sidebar">
    <a routerLink="/" class="app-sidebar__brand" (click)="closeDrawer()">
      <span class="app-sidebar__logo" aria-hidden="true">FP</span>
      <span class="app-sidebar__brand-text">FlowPilot</span>
    </a>

    <nav class="app-sidebar__nav">
      <a
        routerLink="/projects"
        routerLinkActive="app-sidebar__link--active"
        class="app-sidebar__link"
        data-testid="nav-projects"
        (click)="closeDrawer()"
        >Proyectos</a
      >
      <a
        routerLink="/profile"
        routerLinkActive="app-sidebar__link--active"
        class="app-sidebar__link"
        data-testid="nav-profile"
        (click)="closeDrawer()"
        >Perfil</a
      >
      @if (authStore.isAdmin()) {
        <a
          routerLink="/admin/users"
          routerLinkActive="app-sidebar__link--active"
          class="app-sidebar__link"
          data-testid="nav-admin-users"
          (click)="closeDrawer()"
          >Usuarios</a
        >
        <a
          routerLink="/admin/permissions"
          routerLinkActive="app-sidebar__link--active"
          class="app-sidebar__link"
          data-testid="nav-admin-permissions"
          (click)="closeDrawer()"
          >Permisos</a
        >
      }
    </nav>

    <div class="app-sidebar__footer">
      <div class="app-sidebar__user">
        <span class="app-sidebar__avatar" data-testid="sidebar-avatar" aria-hidden="true">{{
          currentUserInitial()
        }}</span>
        <span class="app-sidebar__user-email" data-testid="sidebar-user-email">{{ currentUserEmail() }}</span>
      </div>
      <fp-button variant="secondary" testId="logout-button" (click)="onLogout()">Cerrar sesión</fp-button>
    </div>
  </aside>
} @else {
  <header class="app-topbar app-topbar--minimal" data-testid="app-topbar">
    <a routerLink="/" class="app-topbar__brand">FlowPilot</a>
  </header>
}

<main class="app-content" [class.app-content--with-sidebar]="authStore.isAuthenticated()">
  <div class="app-content__container">
    <router-outlet />
  </div>
</main>
