server {
    listen 80;
    # https://localhost is served with a self-signed cert (see frontend/Dockerfile)
    # only so the e2e suite can exercise `Secure`-cookie flows on WebKit. Real
    # deploys terminate TLS upstream and never hit this listener.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location ~* \.(?:css|gif|ico|jpeg|jpg|js|png|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation calls Ollama with a 60s read timeout on the backend.
        # nginx's 60s proxy_read_timeout default would fire first and return its
        # own HTML 504, hiding the backend's Spanish RFC 7807 503. Give the
        # backend headroom so its error contract (AiGenerationException -> 503
        # "El asistente de IA no está disponible en este momento.") is what the
        # client actually receives.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
